<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostureGuard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d1a;
      --surface:  #161628;
      --border:   #2a2a4a;
      --text:     #dde2ff;
      --muted:    #6b7099;
      --green:    #2ecc8c;
      --orange:   #f39c2e;
      --red:      #e05252;
      --accent:   #6c72ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
    header .meta { display: flex; gap: 24px; color: var(--muted); font-size: 13px; }
    header .meta span b { color: var(--text); }
    #ollama-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      background: #1e2a1e;
      color: var(--green);
      border: 1px solid #2e5a2e;
    }
    #ollama-badge.offline { background: #2a1e1e; color: var(--red); border-color: #5a2e2e; }

    /* ── Main grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 16px 24px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .card h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Video feed ── */
    .video-wrap {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 4/3;
    }
    .video-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #cal-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    #cal-overlay.active { display: flex; }
    #cal-progress-bar-wrap {
      width: 220px; height: 8px;
      background: #2a2a4a; border-radius: 99px; overflow: hidden;
    }
    #cal-progress-bar {
      height: 100%; width: 0%;
      background: var(--accent); border-radius: 99px;
      transition: width .2s;
    }
    #cal-text { font-size: 15px; font-weight: 600; color: #fff; }

    /* ── Right panel ── */
    .right-panel { display: flex; flex-direction: column; gap: 14px; }

    /* Score card */
    .score-card { text-align: center; padding: 24px 16px; }
    #score-ring {
      width: 140px; height: 140px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: conic-gradient(var(--green) 0% var(--score-pct, 100%), #1e2040 0%);
      box-shadow: 0 0 0 8px var(--bg);
      transition: background .4s;
    }
    #score-value {
      font-size: 42px; font-weight: 800; line-height: 1;
      color: var(--text);
    }
    #score-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #posture-status {
      font-size: 15px; font-weight: 600; margin-top: 4px;
    }

    /* Alerts */
    #alerts-list { display: flex; flex-direction: column; gap: 6px; min-height: 28px; }
    .alert-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: rgba(224,82,82,.12);
      border: 1px solid rgba(224,82,82,.3);
      border-radius: 8px;
      font-size: 13px; color: #f08080;
    }
    .alert-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%; background: var(--red); flex-shrink: 0;
    }
    .good-badge {
      padding: 6px 10px;
      background: rgba(46,204,140,.1);
      border: 1px solid rgba(46,204,140,.25);
      border-radius: 8px;
      font-size: 13px; color: var(--green);
    }

    /* Tip card */
    #tip-text {
      font-size: 13px; line-height: 1.6; color: var(--text);
      min-height: 40px;
    }
    #tip-source { font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* Session label */
    #session-label-badge {
      display: none;
      font-size: 12px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(108,114,255,.15);
      border: 1px solid rgba(108,114,255,.3);
      color: var(--accent);
    }

    /* Calibrate button */
    #cal-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    #cal-btn:disabled { opacity: .45; cursor: not-allowed; }
    #cal-btn:not(:disabled):hover { opacity: .85; }

    /* Session report button */
    #report-btn {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    #report-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── Chart section ── */
    .chart-section {
      max-width: 1300px;
      margin: 0 auto 24px;
      padding: 0 24px;
    }
    #history-chart { height: 140px !important; }

    /* ── Responsive ── */
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>🧍 PostureGuard</h1>
  <div class="meta">
    <span>Session <b><span id="session-time">0.0</span> min</b></span>
    <span>Alerts <b><span id="alert-count">0</span></b></span>
  </div>
  <span id="ollama-badge">Ollama ●</span>
</header>

<div class="grid">
  <!-- Left: video -->
  <div>
    <div class="card" style="padding:12px;">
      <h3>Live Feed</h3>
      <div class="video-wrap">
        <img src="/video_feed" alt="camera feed" id="feed-img">
        <div id="cal-overlay">
          <div id="cal-text">Calibrating…</div>
          <div id="cal-progress-bar-wrap">
            <div id="cal-progress-bar"></div>
          </div>
          <div style="font-size:13px;color:#aaa;">Sit in your best upright posture</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: panels -->
  <div class="right-panel">

    <!-- Score -->
    <div class="card score-card">
      <h3>Posture Score</h3>
      <div id="score-ring" style="--score-pct:100%;">
        <span id="score-value">--</span>
        <span id="score-label">/ 100</span>
      </div>
      <div id="posture-status" style="color:var(--muted);">Not calibrated</div>
    </div>

    <!-- Alerts -->
    <div class="card">
      <h3>Active Alerts</h3>
      <div id="alerts-list">
        <div class="good-badge">✓ Waiting for calibration</div>
      </div>
    </div>

    <!-- Coach tip -->
    <div class="card">
      <h3>Coach Tip</h3>
      <p id="tip-text">Calibrate to start monitoring your posture.</p>
      <p id="tip-source"></p>
      <span id="session-label-badge"></span>
    </div>

    <!-- Actions -->
    <button id="cal-btn" onclick="calibrate()">🎯 Calibrate</button>
    <button id="report-btn" onclick="getSessionReport()">📊 Analyse Session (HuggingFace)</button>

  </div>
</div>

<!-- History chart -->
<div class="chart-section">
  <div class="card">
    <h3>Posture History — last 5 min</h3>
    <canvas id="history-chart"></canvas>
  </div>
</div>

<script src="/static/js/dashboard.js"></script>
</body>
</html>
