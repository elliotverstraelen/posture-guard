name: Release

on:
  push:
    tags:
      - "v*"   # triggers on:  git tag v1.2.0 && git push --tags

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-menubar.txt py2app

      - name: Build .app bundle
        run: VERSION="${{ github.ref_name }}" python setup.py py2app

      - name: Zip the .app
        run: |
          VERSION="${{ github.ref_name }}"
          cd dist
          zip -r "PostureGuard-${VERSION}-macOS.zip" PostureGuard.app

      - name: Compute tarball SHA256 for Homebrew
        id: sha
        run: |
          VERSION="${{ github.ref_name }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz"
          curl -sL "$URL" -o /tmp/release.tar.gz
          SHA=$(shasum -a 256 /tmp/release.tar.gz | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PostureGuard ${{ github.ref_name }}"
          body: |
            ## PostureGuard ${{ github.ref_name }}

            ### Quick install
            ```bash
            brew tap elliotverstraelen/postureguard
            brew install postureguard
            postureguard
            ```

            ### Manual install — download the .app
            Download **PostureGuard-${{ github.ref_name }}-macOS.zip**, unzip,
            and drag `PostureGuard.app` to your Applications folder.

            On first launch macOS will ask for camera permission — click OK.

            ### Requirements
            - macOS 12 or later
            - [Ollama](https://ollama.ai) for AI coaching tips (optional)
          files: dist/PostureGuard-${{ github.ref_name }}-macOS.zip
          generate_release_notes: true

      - name: Update Homebrew formula SHA256
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          REPO="elliotverstraelen/homebrew-postureguard"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${REPO}.git" tap
          cd tap

          # Update the URL and sha256 lines in the formula
          sed -i '' \
            "s|url \".*posture-guard.*\"|url \"https://github.com/elliotverstraelen/posture-guard/archive/refs/tags/${VERSION}.tar.gz\"|" \
            Formula/postureguard.rb
          sed -i '' \
            "s|sha256 \"[a-f0-9]*\" # postureguard|sha256 \"${SHA}\" # postureguard|" \
            Formula/postureguard.rb

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/postureguard.rb
          git diff --staged --quiet || git commit -m "Update postureguard to ${VERSION}"
          git push
